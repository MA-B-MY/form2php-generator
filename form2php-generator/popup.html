<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 400px; padding: 15px; font-family: sans-serif; background-color: #f9f9f9; }
    .input-box { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 14px; }
    
    .routing-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .routing-row .input-box { margin-bottom: 0; font-size: 12px; }

    .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: bold; color: #333;}
    .mode-select { width: 48%; padding: 6px; font-size: 12px; font-weight: bold; border: 1px solid #ccc; border-radius: 4px;}
    
    .btn { background-color: #1976d2; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; font-size: 12px; font-weight: bold;}
    .btn:hover { background-color: #1565c0; }
    .btn-sql { background-color: #f57c00; }
    .btn-sql:hover { background-color: #ef6c00; }
    
    #formSelect { display: none; background-color: #fff; cursor: pointer; }
    #progress-container { height: 4px; background: #e0e0e0; border-radius: 2px; margin-bottom: 12px; overflow: hidden; display: none; }
    #progress-bar { height: 100%; width: 0%; background-color: #2e7d32; transition: width 0.3s ease; }
    #message { font-weight: bold; font-size: 13px; margin-bottom: 10px; color: #333; }
    #output { font-family: 'Consolas', monospace; background-color: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 5px; white-space: pre-wrap; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <select id="formSelect" class="input-box"></select>
  <input type="text" id="tableName" class="input-box" placeholder="Enter table name (e.g., users)">
  
  <div class="routing-row" id="routingRow">
    <input type="text" id="successUrl" class="input-box" placeholder="Success URL (e.g., dashboard.php)">
    <input type="text" id="errorUrl" class="input-box" placeholder="Error URL (e.g., fail.php)">
  </div>
  
  <div class="controls-row" id="optionsRow">
    <select id="queryMode" class="mode-select">
      <option value="insert">Mode: INSERT</option>
      <option value="update">Mode: UPDATE</option>
    </select>
    <label><input type="checkbox" id="toggleValidation"> Include Validation</label>
  </div>
  
  <div class="controls-row">
    <button id="toggleView" class="btn btn-sql" style="width: 100%;">View SQL Schema</button>
  </div>
  
  <div id="progress-container"><div id="progress-bar"></div></div>
  <div id="message">Scanning for inputs...</div>
  <pre id="output"></pre>
  
  <script src="popup.js"></script>
</body>
</html>
